[build-system]
# 1.27 is the first hatchling with PEP 639 license expressions and license-files
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telegram-cli"
version = "0.2.0"
description = "A Telegram CLI tool for power users and agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Romamo" }]
requires-python = ">=3.14"
dependencies = [
    "treaty>=0.1.0",
    "telethon>=1.38",
    "pydantic-settings>=2.7",
    "cryptg>=0.4",
]

[project.optional-dependencies]
# treaty-mcp: serve every command as an MCP tool over stdio
mcp = ["treaty[mcp]"]

[project.urls]
Homepage = "https://github.com/romamo/telegram-cli"
Repository = "https://github.com/romamo/telegram-cli"
Issues = "https://github.com/romamo/telegram-cli/issues"

[project.scripts]
tg = "telegram_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_cli"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
